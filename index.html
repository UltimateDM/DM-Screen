<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DM-Screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#14110e;--panel:#1d1915;--panel2:#272119;--line:#3a3128;--text:#ebe2d2;--mute:#9b8f7c;--acc:#d9a441;--bad:#b5472f;--ok:#5fa86a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1a1409;border-color:var(--acc);font-weight:600}
button.danger:hover{border-color:var(--bad);color:#f2a08e}
input,textarea{font:inherit;color:inherit;background:#100d0a;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
label{display:block;color:var(--mute);font-size:12px;margin:10px 0 3px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}

#app{height:100%}
#dm{display:grid;grid-template-columns:330px 1fr;grid-template-rows:48px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:19px;color:var(--acc);letter-spacing:.5px;margin-right:8px}
.spacer{flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 4px;color:var(--mute)}
.tabs button.on{background:transparent;color:var(--acc);border-bottom:2px solid var(--acc);font-weight:600}
.listhead{display:flex;gap:6px;padding:10px}
#list{flex:1;overflow:auto;padding:0 10px 10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.card.active{border-color:var(--acc)}
.chead{display:flex;gap:10px;align-items:center;padding:8px;cursor:pointer}
.chead img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#000;flex:none}
.chead b{display:block}
.chead small{color:var(--mute)}
.cbtns{display:flex;gap:5px;padding:0 8px 8px;flex-wrap:wrap}
.cbtns button{padding:3px 8px;font-size:12px}
.det{padding:0 10px 10px;font-size:13px;white-space:pre-wrap;color:#cfc4b0}
.det b{color:var(--acc)}
.hint{color:var(--mute);padding:14px;text-align:center;font-size:13px}

main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0d0b09}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tb{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#tb .grp{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#tb label{margin:0;display:flex;align-items:center;gap:5px;color:var(--text)}
#tb input[type=range]{width:100px}
#pp textarea{min-height:70px;width:min(560px,80vw);resize:vertical}
#pp input#pTitle{width:220px}
#ptip{position:absolute;z-index:5;pointer-events:none;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:6px 10px;max-width:280px;white-space:pre-wrap;font-size:13px}
#ptip b{color:var(--acc)}
#tp,#pp{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(29,25,21,.96);border:1px solid var(--acc);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips button{padding:2px 8px;font-size:12px}
.chips .exh{display:flex;align-items:center;gap:4px;font-size:12px;margin-left:6px}
.chips .exh button{padding:0 7px}
#tp label{margin:0;display:flex;align-items:center;gap:6px;color:var(--text)}
#tp input[type=range]{width:110px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:40px;pointer-events:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#1a1409;padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--acc);border-radius:10px;padding:18px 20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
select{font:inherit;color:inherit;background:#100d0a;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.inl{display:inline-flex!important;align-items:center;gap:4px;margin:0!important;color:var(--text)!important}
.dd{display:flex;flex-wrap:wrap;gap:4px}.dd button{padding:3px 8px;font-size:12px}
#dpForm .tprow:not(.dadv),.dform .tprow:not(.dadv){flex-wrap:nowrap;gap:5px;margin-top:6px}
#dpForm .tprow button,.dform .tprow button{padding:2px 8px}
#dpForm .tprow span:nth-of-type(2),.dform .tprow span:nth-of-type(2){margin-left:4px!important}
.rl{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}.rl.crit b{color:#ffd54a}.rl.fumble b{color:#ff7a6e}.rl small{color:var(--mute)}
#dp{position:absolute;top:10px;right:10px;width:330px;max-height:calc(100% - 20px);overflow:auto;background:rgba(29,25,21,.97);border:1px solid var(--acc);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
#dp label.chk{display:flex;align-items:center;gap:6px;margin:4px 0 0;color:var(--text)}
#dpLog{max-height:200px;overflow:auto}
#rq{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;width:330px;z-index:4}
.rqc{background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
[hidden]{display:none!important}

/* Spieleransicht */
body.player{background:#000;cursor:none}
#pc{position:fixed;inset:0;width:100%;height:100%;display:block}
#pshow,#pblack{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
#pshow{background:radial-gradient(circle at center,#1a1510,#050403);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vh}
#pshow.on,#pblack.on{opacity:1}
#pshow img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 0 60px rgba(0,0,0,.8)}
#pshow .cap{font:600 5vh Georgia,serif;color:#ebe2d2;letter-spacing:.06em;text-shadow:0 2px 12px #000}
#pblack{background:#000;transition-duration:.8s}
#pwait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#6d6252;font:italic 3vh Georgia,serif}
body.remote{cursor:default}
#pc.aim{cursor:crosshair}
#pidle{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity 1s;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#2b2015 0%,#140f0b 55%,#050403 100%)}
#pidle.on{opacity:1}
#pibg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(7px) brightness(.38) saturate(.9);opacity:0;transition:opacity 1.2s;animation:kenburns 45s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,1%)}}
.pifog{position:absolute;width:150%;height:55%;left:-25%;background:radial-gradient(ellipse at center,rgba(255,236,200,.085),transparent 66%);filter:blur(28px)}
.pifog.f1{top:8%;animation:drift1 42s ease-in-out infinite alternate}
.pifog.f2{top:48%;animation:drift2 55s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translateX(-6%)}to{transform:translateX(9%)}}
@keyframes drift2{from{transform:translateX(8%)}to{transform:translateX(-10%)}}
#pembers{position:absolute;inset:0;width:100%;height:100%}
#pitext{position:absolute;left:0;right:0;top:34%;text-align:center;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}
#pit{font:600 7.2vh Georgia,'Times New Roman',serif;letter-spacing:.07em;color:#ecdcb8;text-shadow:0 0 32px rgba(217,164,65,.5),0 3px 14px #000}
#pis{margin-top:1.6vh;font:italic 3.2vh Georgia,serif;color:#a99b82;text-shadow:0 2px 10px #000}
#pparty{position:absolute;left:0;right:0;bottom:6vh;display:flex;justify-content:center;gap:2.6vw;flex-wrap:wrap}
.ppm{display:flex;flex-direction:column;align-items:center;gap:1vh}
.ppm img{width:11vh;height:11vh;border-radius:50%;object-fit:cover;border:2px solid #d9a441;background:#111;box-shadow:0 0 24px rgba(0,0,0,.7)}
.ppm span{font:600 2.3vh Georgia,serif;color:#d9cdb4;text-shadow:0 2px 8px #000}
#pdock{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;align-items:center;background:rgba(29,25,21,.92);border:1px solid var(--line);border-radius:10px;padding:6px 10px;z-index:11;cursor:default}
#pdock[hidden]{display:none}
#pgstat{font-size:13px;color:var(--acc);min-width:6em}
#proll{position:fixed;top:5vh;left:50%;transform:translateX(-50%);min-width:30vw;text-align:center;background:rgba(20,16,12,.94);border:2px solid #d9a441;border-radius:14px;padding:2vh 4vw;opacity:0;pointer-events:none;transition:opacity .35s;box-shadow:0 0 40px rgba(0,0,0,.7);z-index:10}
#proll.on{opacity:1}
#proll .who{font:600 3vh Georgia,serif;color:#d9a441}
#proll .num{font:700 14vh/1.1 Georgia,serif;color:#fff}
#proll .sub{font-size:2.4vh;color:#bfb39d}
#proll.crit{border-color:#ffd54a;box-shadow:0 0 60px rgba(255,213,74,.55)}#proll.crit .num{color:#ffd54a}
#proll.fumble{border-color:#d9453a;box-shadow:0 0 60px rgba(217,69,58,.5)}#proll.fumble .num{color:#ff7a6e}
#dbtn{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;font-size:22px;padding:0;background:rgba(29,25,21,.92);z-index:11}
#dpan{position:fixed;right:14px;bottom:70px;width:300px;background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:11;cursor:default}
#dpan .tprow{gap:6px;font-size:13px}
#dstat{font-size:13px;color:var(--acc);min-height:1em}
#dlog{font-size:12px;max-height:110px;overflow:auto}
#pprompt{position:fixed;top:18vh;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--acc);border-radius:12px;padding:20px 28px;text-align:center;font:600 20px Georgia,serif;z-index:12;box-shadow:0 0 50px rgba(0,0,0,.8)}
#pprompt button{margin-top:14px;font-size:18px;padding:8px 22px}
#pname{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:22px Georgia,serif;z-index:20;cursor:default}
#pname input{width:280px;text-align:center;font-size:18px}
#pstat{position:fixed;left:2vw;bottom:2vh;color:#bfb39d;font-size:14px;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:6px}
#pstat:empty{display:none}
#phint{position:fixed;bottom:2vh;right:2vw;color:#6d6252;font-size:13px;animation:fade 6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(() => {
'use strict';

const QS = new URLSearchParams(location.search);
const JOIN = (QS.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const ROLE = JOIN || QS.get('view') === 'player' ? 'player' : 'dm';
const CH = new BroadcastChannel('dnd-dm-screen-v1');

/* ---------- Online-Verbindung (PeerJS / WebRTC) ---------- */
const PEER_PREFIX = 'dndds-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CHARS[b % CODE_CHARS.length]).join('');
const getPeer = () => window.Peer || (window.peerjs && window.peerjs.Peer);
let peerLoad = null;
function loadPeerJS() {
  if (getPeer()) return Promise.resolve();
  if (peerLoad) return peerLoad;
  const urls = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1/dist/peerjs.min.js'];
  peerLoad = (async () => {
    for (const u of urls) {
      try {
        await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = () => rej(new Error(u)); document.head.appendChild(s); });
        if (getPeer()) return;
      } catch (e) { console.warn('PeerJS-Quelle nicht erreichbar:', e.message); }
    }
    throw new Error('PeerJS konnte nicht geladen werden');
  })();
  peerLoad.catch(() => { peerLoad = null; });
  return peerLoad;
}
// Blobs werden für die Leitung in ArrayBuffer umgewandelt (und zurück)
async function toWire(msg) { if (msg.blob) { const { blob, ...rest } = msg; return { ...rest, buf: await blob.arrayBuffer(), mime: blob.type }; } return msg; }
/* ---------- Würfel (gemeinsam) ---------- */
const DICE = [4, 6, 8, 10, 12, 20, 100];
function rndInt(n) { const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n; do { crypto.getRandomValues(a); } while (a[0] >= lim); return a[0] % n + 1; }
function sanitizeSpec(s) {
  const count = clamp(parseInt(s.count) || 1, 1, 20), sides = DICE.includes(+s.sides) ? +s.sides : 20, mod = clamp(parseInt(s.mod) || 0, -30, 30);
  const adv = sides === 20 && count === 1 && (s.adv === 'adv' || s.adv === 'dis') ? s.adv : '';
  return { count, sides, mod, adv, label: String(s.label || '').slice(0, 40) };
}
function evalRoll(spec) {
  const dice = Array.from({ length: spec.adv ? 2 : spec.count }, () => rndInt(spec.sides));
  const used = spec.adv ? [spec.adv === 'adv' ? Math.max(...dice) : Math.min(...dice)] : dice;
  return { dice, used, total: used.reduce((a, b) => a + b, 0) + spec.mod };
}
const specText = s => `${s.adv ? (s.adv === 'adv' ? 'Vorteil ' : 'Nachteil ') : ''}${s.count}W${s.sides}${s.mod ? (s.mod > 0 ? '+' : '−') + Math.abs(s.mod) : ''}`;
const critClass = r => r.spec.sides === 20 && r.used.length === 1 ? (r.used[0] === 20 ? 'crit' : r.used[0] === 1 ? 'fumble' : '') : '';
const hueOf = str => { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const diceFormHTML = () => `<div class="dd">${DICE.map(d => `<button type="button" data-s="${d}">W${d}</button>`).join('')}</div>
  <div class="tprow"><span>Anzahl</span><button type="button" data-c="-1">−</button><b class="dcn">1</b><button type="button" data-c="1">+</button>
  <span style="margin-left:10px">Mod</span><button type="button" data-m="-1">−</button><b class="dmn">+0</b><button type="button" data-m="1">+</button></div>
  <div class="tprow dadv"><label class="inl"><input type="radio" name="dadv" value="" checked> normal</label><label class="inl"><input type="radio" name="dadv" value="adv"> Vorteil</label><label class="inl"><input type="radio" name="dadv" value="dis"> Nachteil</label></div>`;
function bindDiceForm(root, labelInput) {
  const st = { sides: 20, count: 1, mod: 0 };
  const sync = () => {
    root.querySelectorAll('.dd button').forEach(b => b.classList.toggle('on', +b.dataset.s === st.sides));
    root.querySelector('.dcn').textContent = st.count; root.querySelector('.dmn').textContent = (st.mod >= 0 ? '+' : '−') + Math.abs(st.mod);
    root.querySelector('.dadv').style.visibility = st.sides === 20 && st.count === 1 ? 'visible' : 'hidden';
  };
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.s) st.sides = +b.dataset.s; if (b.dataset.c) st.count = clamp(st.count + +b.dataset.c, 1, 20); if (b.dataset.m) st.mod = clamp(st.mod + +b.dataset.m, -30, 30);
    sync();
  });
  sync();
  return () => sanitizeSpec({ ...st, adv: (root.querySelector('input[name=dadv]:checked') || {}).value || '', label: labelInput.value });
}
function fromWire(d) { if (d && d.buf) { const { buf, mime, ...rest } = d; rest.blob = new Blob([buf], { type: mime }); return rest; } return d; }
const FOG_MAX = 2048;
const TS = 256;   // Kachelgröße für die Online-Übertragung
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const CONDS = [
  { k: 'blind', n: 'Blind', e: '🙈' }, { k: 'charmed', n: 'Bezaubert', e: '💘' }, { k: 'deaf', n: 'Taub', e: '🔇' },
  { k: 'frightened', n: 'Verängstigt', e: '😱' }, { k: 'grappled', n: 'Gepackt', e: '🤝' }, { k: 'incapacitated', n: 'Handlungsunfähig', e: '💫' },
  { k: 'invisible', n: 'Unsichtbar', e: '👻' }, { k: 'paralyzed', n: 'Gelähmt', e: '⚡' }, { k: 'petrified', n: 'Versteinert', e: '🗿' },
  { k: 'poisoned', n: 'Vergiftet', e: '🤢' }, { k: 'prone', n: 'Liegend', e: '⬇️' }, { k: 'restrained', n: 'Festgesetzt', e: '⛓️' },
  { k: 'stunned', n: 'Betäubt', e: '💥' }, { k: 'unconscious', n: 'Bewusstlos', e: '💤' },
  { k: 'conc', n: 'Konzentration', e: '🧠' }, { k: 'bloodied', n: 'Angeschlagen', e: '🩸' }, { k: 'dead', n: 'Tot', e: '💀' }
];
const PINICONS = [{ k: 'note', e: '📍' }, { k: 'trap', e: '⚠️' }, { k: 'loot', e: '💰' }, { k: 'door', e: '🚪' }, { k: 'fight', e: '⚔️' }, { k: 'npc', e: '🗣️' }];
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- Nebel (gemeinsam für beide Ansichten) ---------- */
function newFog(w, h) {
  const k = Math.min(1, FOG_MAX / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function fogApply(fc, op) {
  const ctx = fc.getContext('2d'), k = fc.width;
  ctx.globalCompositeOperation = op.rv ? 'destination-out' : 'source-over';
  ctx.fillStyle = '#000';
  if (op.k === 'a') ctx.fillRect(0, 0, fc.width, fc.height);
  else if (op.k === 'r') ctx.fillRect(op.x * k, op.y * k, op.w * k, op.h * k);
  else if (op.k === 'c') {
    const x = op.x * k, y = op.y * k, r = Math.max(1, op.r * k);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.7, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Karten-Renderer (gemeinsam) ---------- */
function makeRenderer(canvas, role) {
  const ctx = canvas.getContext('2d');
  const R = {
    canvas, role, cam: { cx: .5, cy: .5, s: 500 }, W: 1, H: 1, dpr: 1,
    mapImg: null, hh: 1, fog: null, tokens: [], pins: [], marks: [], lastDraw: 0, grid: null, imgs: new Map(), overlay: null, dirty: true,
    resize() {
      const r = canvas.getBoundingClientRect(); this.dpr = window.devicePixelRatio || 1;
      this.W = Math.max(1, r.width); this.H = Math.max(1, r.height);
      canvas.width = Math.round(this.W * this.dpr); canvas.height = Math.round(this.H * this.dpr); this.dirty = true;

const DB = {
  ok: false, db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('dnd-dm-screen', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', { keyPath: 'id' }); d.createObjectStore('assets', { keyPath: 'id' }); d.createObjectStore('meta', { keyPath: 'k' }); };
      r.onsuccess = () => { this.db = r.result; this.ok = true; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    if (!this.ok) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', o => o.getAll()).then(r => r || []); },
  get(s, k) { return this.tx(s, 'readonly', o => o.get(k)); },
  put(s, v) { return this.tx(s, 'readwrite', o => o.put(v)); },
  del(s, k) { return this.tx(s, 'readwrite', o => o.delete(k)); }
};

async function prepImage(file, maxSide, type) {
  const bmp = await createImageBitmap(file);
  let w = bmp.width, h = bmp.height, blob = file;
  const m = Math.max(w, h);

    const k = maxSide / m; w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    blob = await new Promise(r => c.toBlob(r, type, .92));
  }

  tc.width = Math.max(1, Math.round(w * k2)); tc.height = Math.max(1, Math.round(h * k2));
  tc.getContext('2d').drawImage(bmp, 0, 0, tc.width, tc.height);
  const thumb = await new Promise(r => tc.toBlob(r, 'image/png'));
  if (bmp.close) bmp.close();
  return { blob, w, h, thumb };
}

  async function deleteItem(it) {
    if (!confirm(`„${it.name}“ wirklich löschen?`)) return;
    S.items = S.items.filter(i => i !== it);
    await DB.del('items', it.id); await DB.del('assets', it.img); assetCache.delete(it.img);
    if (it.type === 'map') { if (S.mapId === it.id) closeMapView(); saveMeta(); }
    else for (const m of S.items.filter(i => i.type === 'map')) { const n = m.tokens.length; m.tokens = m.tokens.filter(t => t.libId !== it.id); if (m.tokens.length !== n) saveItem(m); }
    if (S.showing && S.showing.img === it.img) S.showing = null;
    if (S.idle.bgId === it.id) { S.idle.bgId = null; saveIdle(); }
    renderList(); refreshTokens(); syncToolbar(); sendState();
  }

  /* ----- Aktionen: Zeigen, Token ----- */
  function showItem(l) { S.showing = { img: l.img, title: l.pub || '' }; syncToolbar(); sendState(); toast(`„${l.name}“ wird den Spielern gezeigt`); }
  function addToken(l) {
    const m = curMap(); if (!m) { toast('Erst eine Karte öffnen'); return; }
    const t = { id: uid(), libId: l.id, x: clamp(R.cam.cx, 0.02, .98), y: clamp(R.cam.cy, 0.02, R.hh - .02), size: m.grid.on ? 1 / m.grid.count : .04, hidden: l.type === 'enemy' };
    m.tokens.push(t); S.selTok = t.id; refreshTokens(); saveMapSoon(); sendState();
    toast(l.type === 'enemy' ? 'Token gesetzt (für Spieler versteckt)' : 'Token gesetzt');
  }

  /* ----- Pointer / Nebel / Tokens ----- */
  const cv = $('#cv');
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const pushUndo = () => { if (!fogCanvas) return; undo.push(fogCanvas.getContext('2d').getImageData(0, 0, fogCanvas.width, fogCanvas.height)); if (undo.length > 8) undo.shift(); };
  function doUndo() { if (!undo.length || !fogCanvas) return; fogCanvas.getContext('2d').putImageData(undo.pop(), 0, 0); R.dirty = true; flushOps(); sendFog(); fogChanged(); }
  function applyOp(op) { fogApply(fogCanvas, op); pendingOps.push(op); scheduleFlush(); R.dirty = true; }
  function brushAt(p, rv) { applyOp({ k: 'c', x: p.x, y: p.y, r: S.brush, rv }); }
  function hitToken(p) {
    const m = curMap(); if (!m) return null;
    for (let i = m.tokens.length - 1; i >= 0; i--) { const t = m.tokens[i]; if (Math.hypot(p.x - t.x, p.y - t.y) <= Math.max(t.size / 2, 10 / R.cam.s)) return t; }
    return null;
  }
  function selectToken(id) { S.selTok = id; S.selPin = null; refreshTokens(); }
  function selectPin(id) { S.selPin = id; S.selTok = null; refreshTokens(); }
  function currentView() { return { cx: R.cam.cx, cy: R.cam.cy, vw: R.W / R.cam.s, vh: R.H / R.cam.s }; }
  function viewChanged() { R.dirty = true; if (S.live) { S.view = currentView(); sendStateSoon(); } }

  R.overlay = (ctx, cam) => {
    if (drag && drag.k === 'rect') {
      const a = drag.a, b = drag.b; ctx.lineWidth = 2 / cam.s; ctx.setLineDash([8 / cam.s, 5 / cam.s]);
      ctx.strokeStyle = drag.rv ? '#ffe08a' : '#ff8a8a'; ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(a.x - b.x), Math.abs(a.y - b.y)); ctx.setLineDash([]);
    } else if (S.hover && (S.tool === 'reveal' || S.tool === 'hide')) {
      ctx.beginPath(); ctx.arc(S.hover.x, S.hover.y, S.brush, 0, Math.PI * 2); ctx.lineWidth = 1.5 / cam.s;
      ctx.strokeStyle = (S.tool === 'reveal') !== !!S.hover.alt ? '#ffe08a' : '#ff8a8a'; ctx.stroke();
    }
  };

  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    if (!R.mapImg) return;
    cv.setPointerCapture(e.pointerId);
    const p = pt(e), m = R.toMap(p.x, p.y), pan = { k: 'pan', sx: p.x, sy: p.y, cx: R.cam.cx, cy: R.cam.cy };
    if (e.button === 1 || e.button === 2 || S.space) { drag = pan; return; }
    if (e.button !== 0) return;
    if (S.tool === 'select' || S.tool === 'pin') {
      const pn = hitPin(m), t = pn ? null : hitToken(m);
      if (pn) { selectPin(pn.id); drag = { k: 'pin', id: pn.id, dx: pn.x - m.x, dy: pn.y - m.y }; }
      else if (t && S.tool === 'select') { selectToken(t.id); drag = { k: 'tok', id: t.id, dx: t.x - m.x, dy: t.y - m.y }; }
      else if (S.tool === 'pin') addPin(m);
      else { selectToken(null); drag = pan; }
    } else if (S.tool === 'reveal' || S.tool === 'hide') {
      pushUndo(); const rv = (S.tool === 'reveal') !== e.altKey; drag = { k: 'brush', rv, last: m }; brushAt(m, rv);
    } else if (S.tool === 'rect') drag = { k: 'rect', a: m, b: m, rv: !e.altKey };
  });
  cv.addEventListener('pointermove', e => {
    if (!R.mapImg) return;
    const p = pt(e), m = R.toMap(p.x, p.y); S.hover = { x: m.x, y: m.y, alt: e.altKey }; R.dirty = true;
    if (!drag) { updateTip(p, m); return; }
    $('#ptip').hidden = true;
    if (drag.k === 'pin') {
      const pn = curPins().find(x => x.id === drag.id);
      if (pn) { pn.x = clamp(m.x + drag.dx, 0, 1); pn.y = clamp(m.y + drag.dy, 0, R.hh); syncPins(); saveMapSoon(); if (pn.vis) sendStateSoon(); }
    } else if (drag.k === 'pan') { R.cam.cx = drag.cx - (p.x - drag.sx) / R.cam.s; R.cam.cy = drag.cy - (p.y - drag.sy) / R.cam.s; viewChanged(); }
    else if (drag.k === 'tok') {
      const mp = curMap(), t = mp && mp.tokens.find(x => x.id === drag.id);
      if (t) { t.x = clamp(m.x + drag.dx, 0, 1); t.y = clamp(m.y + drag.dy, 0, R.hh); refreshTokens(); sendStateSoon(); saveMapSoon(); }
    } else if (drag.k === 'brush') {
      const dx = m.x - drag.last.x, dy = m.y - drag.last.y, dist = Math.hypot(dx, dy), step = Math.max(S.brush * .3, .0008);
      for (let d = step; d <= dist; d += step) brushAt({ x: drag.last.x + dx * d / dist, y: drag.last.y + dy * d / dist }, drag.rv);
      if (dist >= step) drag.last = m;
    } else if (drag.k === 'rect') drag.b = m;
  });
  const endDrag = () => {
    if (!drag) return;
    if (drag.k === 'brush') fogChanged();
    else if (drag.k === 'rect') {
      const w = Math.abs(drag.a.x - drag.b.x), h = Math.abs(drag.a.y - drag.b.y);
      if (w > .002 && h > .002) { pushUndo(); applyOp({ k: 'r', x: Math.min(drag.a.x, drag.b.x), y: Math.min(drag.a.y, drag.b.y), w, h, rv: drag.rv }); fogChanged(); }
    }
    drag = null; R.dirty = true;
  };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('pointerleave', () => { S.hover = null; $('#ptip').hidden = true; R.dirty = true; });
  cv.addEventListener('wheel', e => {
    if (!R.mapImg) return; e.preventDefault();
    const p = pt(e), b = R.toMap(p.x, p.y), f = Math.pow(1.0015, -e.deltaY);
    R.cam.s = clamp(R.cam.s * f, 40, 20000);
    R.cam.cx = b.x - (p.x - R.W / 2) / R.cam.s; R.cam.cy = b.y - (p.y - R.H / 2) / R.cam.s; viewChanged();
  }, { passive: false });

  /* ----- Buttons ----- */
  $('#tools').onclick = e => { const b = e.target.closest('[data-tool]'); if (b) { S.tool = b.dataset.tool; syncToolbar(); R.dirty = true; } };
  $('#brush').oninput = e => { S.brush = +e.target.value; R.dirty = true; };
  $('#bUndo').onclick = doUndo;
  $('#bRevealAll').onclick = () => { if (!fogCanvas) return; pushUndo(); fogApply(fogCanvas, { k: 'a', rv: true }); flushOps(); netSend({ t: 'ops', mapId: S.mapId, ops: [{ k: 'a', rv: true }] }); syncTiles(); R.dirty = true; fogChanged(); };
  $('#bHideAll').onclick = () => { if (!fogCanvas) return; pushUndo(); fogApply(fogCanvas, { k: 'a', rv: false }); flushOps(); netSend({ t: 'ops', mapId: S.mapId, ops: [{ k: 'a', rv: false }] }); R.dirty = true; fogChanged(); };
  $('#gridOn').onchange = e => { const m = curMap(); if (m) { m.grid.on = e.target.checked; saveItem(m); R.dirty = true; sendState(); } };
  $('#gridN').oninput = e => { const m = curMap(); if (m) { m.grid.count = +e.target.value; $('#gridLbl').textContent = m.grid.count; saveMapSoon(); R.dirty = true; sendStateSoon(); } };
  $('#bFit').onclick = () => { R.fit(); S.view = null; sendState(); };
  $('#bSend').onclick = () => { S.view = currentView(); sendState(); toast('Ausschnitt an Spieler gesendet'); };
  $('#live').onchange = e => { S.live = e.target.checked; if (S.live) { S.view = currentView(); sendState(); } };
  $('#bIdle').onclick = () => {
    const dlg = $('#dlg'), imgs = S.items.filter(i => i.type === 'img').sort((a, b) => a.name.localeCompare(b.name, 'de'));
    dlg.innerHTML = `<form id="idf"><h2>Wartebildschirm</h2>
      <p style="color:var(--mute);margin:6px 0 0;font-size:13px">Das sehen die Spieler, wenn du gerade keine Karte und kein Bild zeigst.</p>
      <label>Titel</label><input name="title" value="${esc(S.idle.title)}" placeholder="Gleich geht es weiter …" maxlength="60" autocomplete="off">
      <label>Untertitel</label><input name="sub" value="${esc(S.idle.sub)}" placeholder="z. B. Die Gefährten rasten am Lagerfeuer" maxlength="90" autocomplete="off">
      <label>Hintergrundbild (aus dem Tab „Bilder“)</label><select name="bg"><option value="">Kein Bild (nur Glut und Nebel)</option>${imgs.map(i => `<option value="${i.id}" ${S.idle.bgId === i.id ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" name="party" ${S.idle.party ? 'checked' : ''}> Charaktere der Gruppe unten anzeigen</label>
      <label class="chk"><input type="checkbox" name="on" ${S.idle.on ? 'checked' : ''}> Wartebildschirm jetzt erzwingen (Pause, auch wenn eine Karte offen ist)</label>
      <div class="row"><button type="button" id="idc">Abbrechen</button><button type="submit" class="on">Übernehmen</button></div></form>`;
    dlg.showModal(); $('#idc').onclick = () => dlg.close();
    $('#idf').onsubmit = e => {
      e.preventDefault(); const f = e.target;
      Object.assign(S.idle, { title: f.title.value.trim(), sub: f.sub.value.trim(), bgId: f.bg.value || null, party: f.party.checked, on: f.on.checked });
      saveIdle(); dlg.close(); syncToolbar(); renderList(); sendState();
    };
  };
  $('#bBlack').onclick = () => { S.black = !S.black; syncToolbar(); sendState(); };
  $('#bUnshow').onclick = () => { S.showing = null; syncToolbar(); sendState(); };
  $('#bPlayer').onclick = () => {
    const u = new URL(location.href); u.search = '?view=player'; u.hash = '';
    window.open(u.toString(), 'dnd-player', 'width=1280,height=720');
  };
  $('#tpSize').oninput = e => { const m = curMap(), t = m && m.tokens.find(x => x.id === S.selTok); if (t) { t.size = +e.target.value; refreshTokens(); saveMapSoon(); sendStateSoon(); } };
  $('#tpVis').onchange = e => { const m = curMap(), t = m && m.tokens.find(x => x.id === S.selTok); if (t) { t.hidden = !e.target.checked; refreshTokens(); saveMapSoon(); sendState(); } };
  $('#tpShow').onclick = () => { const m = curMap(), t = m && m.tokens.find(x => x.id === S.selTok), l = t && lib(t.libId); if (l) showItem(l); };
  $('#pIcons').innerHTML = PINICONS.map(i => `<button data-icon="${i.k}">${i.e}</button>`).join('');
  const selPinObj = () => curPins().find(x => x.id === S.selPin);
  $('#pIcons').onclick = e => { const b = e.target.closest('button'), p = selPinObj(); if (!b || !p) return; p.icon = b.dataset.icon; syncPins(); updatePP(); saveMapSoon(); if (p.vis) sendStateSoon(); };
  $('#pTitle').oninput = e => { const p = selPinObj(); if (p) { p.title = e.target.value; syncPins(); saveMapSoon(); } };
  $('#pText').oninput = e => { const p = selPinObj(); if (p) { p.text = e.target.value; saveMapSoon(); } };
  $('#pDel').onclick = () => { const m = curMap(); if (!m) return; m.pins = curPins().filter(x => x.id !== S.selPin); S.selPin = null; refreshTokens(); saveMapSoon(); sendStateSoon(); };
  $('#pVis').onchange = e => { const p = selPinObj(); if (!p) return; p.vis = e.target.checked; $('#pPub').disabled = !p.vis; if (p.vis && !p.pub && p.title) { p.pub = p.title; $('#pPub').value = p.pub; } syncPins(); saveMapSoon(); sendStateSoon(); };
  $('#pPub').oninput = e => { const p = selPinObj(); if (p) { p.pub = e.target.value; saveMapSoon(); sendStateSoon(); } };
  $('#chips').innerHTML = CONDS.map(c => `<button data-cond="${c.k}" title="${c.n}">${c.e} ${c.n}</button>`).join('') +
    `<span class="exh">🥵 Erschöpfung <button data-exh="-1">−</button><b id="exhN">0</b><button data-exh="1">+</button></span>`;
  $('#chips').onclick = e => {
    const m = curMap(), t = m && m.tokens.find(x => x.id === S.selTok), b = e.target.closest('button'); if (!t || !b) return;
    if (b.dataset.cond) { t.cond = t.cond || []; const i = t.cond.indexOf(b.dataset.cond); if (i >= 0) t.cond.splice(i, 1); else t.cond.push(b.dataset.cond); }
    else if (b.dataset.exh) t.exh = clamp((t.exh || 0) + +b.dataset.exh, 0, 6);
    refreshTokens(); saveMapSoon(); sendState();
  };
  $('#bAllChars').onclick = () => {
    const m = curMap(); if (!m) { toast('Erst eine Karte öffnen'); return; }
    const chars = S.items.filter(i => i.type === 'char' && !m.tokens.some(t => t.libId === i.id));
    if (!chars.length) { toast('Alle Charaktere sind schon auf der Karte'); return; }
    const size = m.grid.on ? 1 / m.grid.count : .04, step = size * 1.3, x0 = R.cam.cx - (chars.length - 1) * step / 2;
    chars.forEach((l, i) => m.tokens.push({ id: uid(), libId: l.id, x: clamp(x0 + i * step, .02, .98), y: clamp(R.cam.cy, .02, R.hh - .02), size, hidden: false, cond: [], exh: 0 }));
    refreshTokens(); saveMapSoon(); sendState(); toast(`${chars.length} Charakter(e) auf die Karte gesetzt`);
  };
  $('#tpDel').onclick =() => { const m = curMap(); if (!m) return; m.tokens = m.tokens.filter(x => x.id !== S.selTok); S.selTok = null; refreshTokens(); saveMapSoon(); sendState(); };

  $('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; renderList(); saveMeta(); } };
  $('#search').oninput = renderList;
  $('#bAdd').onclick = () => openEditor(S.tab, null);
  $('#list').onclick = e => {
    const a = e.target.closest('[data-act]'), c = e.target.closest('.card'); if (!a || !c) return;
    const it = lib(c.dataset.id); if (!it) return;
    ({ openmap: () => openMap(it.id), toggle: () => { S.open = S.open === it.id ? null : it.id; renderList(); }, show: () => showItem(it), bg: () => { S.idle.bgId = S.idle.bgId === it.id ? null : it.id; saveIdle(); renderList(); sendState(); toast(S.idle.bgId ? 'Als Hintergrund des Wartebildschirms gesetzt' : 'Wartebild-Hintergrund entfernt'); }, token: () => addToken(it), edit: () => openEditor(it.type, it), del: () => deleteItem(it) })[a.dataset.act]();
  };
  const list = $('#list');
  list.addEventListener('dragover', e => e.preventDefault());
  list.addEventListener('drop', async e => {
    e.preventDefault();
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    try { for (const f of files) await createItem(S.tab, baseName(f.name), f, S.tab === 'map' || S.tab === 'img' ? {} : { sub: '', stats: '', notes: '', pub: '' }); } catch (err) { toast('Ein Bild konnte nicht gelesen werden'); }
    renderList(); toast(`${files.length} Bild(er) hinzugefügt`);
  });

  /* ----- Backup ----- */
  $('#bBackup').onclick = () => {
    const dlg = $('#dlg');
    dlg.innerHTML = `<h2>Backup</h2><p style="color:var(--mute)">Der Browser speichert alles lokal. Sichere deine Daten regelmäßig als Datei, besonders vor dem Löschen von Browserdaten.</p>
      <div class="row" style="justify-content:flex-start"><button id="bExp" class="on">Exportieren</button><button id="bImp">Importieren</button><button id="bCl">Schließen</button></div>`;
    dlg.showModal();
    $('#bCl').onclick = () => dlg.close();
    $('#bImp').onclick = () => $('#importFile').click();
    $('#bExp').onclick = async () => {
      toast('Exportiere …');
      const items = [], assets = [];
      for (const it of S.items) {
        items.push({ ...it, thumb: it.thumb ? await blobToData(it.thumb) : null, fog: it.fog ? await blobToData(it.fog) : null });
        const b = await getAssetBlob(it.img); if (b) assets.push({ id: it.img, data: await blobToData(b) });
      }
      const blob = new Blob([JSON.stringify({ app: 'dm-screen', version: 1, items, assets })], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dm-screen-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000); dlg.close();
    };
  };
  $('#importFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'dm-screen') throw new Error('Falsche Datei');
      for (const a of d.assets) { const b = await dataToBlob(a.data); await DB.put('assets', { id: a.id, blob: b }); assetCache.set(a.id, b); }
      for (const it of d.items) {
        it.thumb = it.thumb ? await dataToBlob(it.thumb) : null; it.fog = it.fog ? await dataToBlob(it.fog) : null;
        await saveItem(it); S.items = S.items.filter(x => x.id !== it.id); S.items.push(it);
      }
      $('#dlg').close(); renderList(); if (S.mapId) openMap(S.mapId); toast('Backup importiert');
    } catch (err) { console.error(err); toast('Import fehlgeschlagen'); }
  };

  /* ----- Tastatur ----- */
  window.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea') && e.target.type !== 'range') return;
    if (e.code === 'Space') { S.space = true; e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return; }
    const k = e.key.toLowerCase();
    if (k === 'v') S.tool = 'select'; else if (k === 'r') S.tool = 'reveal'; else if (k === 'h') S.tool = 'hide'; else if (k === 'b') S.tool = 'rect'; else if (k === 'p') S.tool = 'pin';
    else if (k === '[') S.brush = clamp(S.brush - .01, .01, .2); else if (k === ']') S.brush = clamp(S.brush + .01, .01, .2);
    else if (k === 'escape') selectToken(null);
    else if ((k === 'delete' || k === 'backspace') && (S.selTok || S.selPin)) { (S.selTok ? $('#tpDel') : $('#pDel')).click(); return; }
    else return;
    syncToolbar(); R.dirty = true;
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') S.space = false; });
  new ResizeObserver(() => { R.resize(); }).observe($('#stage'));
  window.addEventListener('beforeunload', () => { const m = curMap(); if (m) saveItem(m); });

  R.resize(); renderList(); syncToolbar();
  if (S.mapId && lib(S.mapId)) await openMap(S.mapId); else { S.mapId = null; sendState(); }
}

if (ROLE === 'player') startPlayer(JOIN); else startDM();
})();
</script>
</body>
</html>
